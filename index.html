<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Holi 2025 · DY Patil — Martin Garrix live (web rooms)</title>
  <meta name="description" content="Martin Garrix Holi 2025 at DY Patil Stadium, rebuilt as a game: join a room with friends, dance, talk and watch the full show together.">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    :root { --bg: #07060a; --fg: #f4f1ea; --dim: #9a94a8; --gold: #ffd34d; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: var(--bg); outline: none; }
    #unity-loading-bar { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 0 16px; background: radial-gradient(ellipse at 50% 40%, #1d1430 0%, var(--bg) 70%); text-align: center; }
    #title { font-size: clamp(26px, 5vw, 52px); font-weight: 800; letter-spacing: 0.04em; }
    #sub { color: var(--gold); font-size: clamp(14px, 2.2vw, 20px); }
    #bar { width: min(420px, 80vw); height: 6px; border-radius: 3px; background: #2a2533; overflow: hidden; margin-top: 12px; }
    #fill { width: 0; height: 100%; background: var(--gold); transition: width 0.2s; }
    #note { color: var(--dim); font-size: 14px; max-width: 520px; line-height: 1.5; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); color: var(--fg);
      flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 16px; }
    #rotate b { color: var(--gold); font-size: 22px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    #unity-warning { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); max-width: 90vw; z-index: 5; }
    #unity-warning div { padding: 10px 14px; border-radius: 6px; margin-bottom: 6px; color: #111; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="unity-loading-bar">
    <div id="title">HOLI 2025 · DY PATIL</div>
    <div id="sub">Martin Garrix — live concert, rebuilt as a game</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="note"><span id="pct">Loading 0%</span> · about 90 MB the first time, quicker after that.<br>
      Best on a laptop or PC with headphones. Join a room code with friends to watch together.</div>
  </div>
  <div id="rotate"><b>Turn your phone sideways</b><span>The concert plays in landscape.</span></div>
  <div id="unity-warning"></div>
  <script>
    var canvas = document.querySelector('#unity-canvas');
    var loading = document.querySelector('#unity-loading-bar');
    var fill = document.querySelector('#fill'), pct = document.querySelector('#pct');
    var warning = document.querySelector('#unity-warning');
    function showBanner(msg, type) {
      var div = document.createElement('div');
      div.innerHTML = msg;
      div.style.background = type == 'error' ? '#ff6b6b' : '#ffd34d';
      warning.appendChild(div);
      if (type != 'error') setTimeout(function () { warning.removeChild(div); }, 6000);
    }
    var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (mobile) document.querySelector('#note').innerHTML += '<br><b>Phone:</b> hold it sideways; left thumb walks, right thumb looks. Newer phones run it best.';
    var buildUrl = 'Build';
    var config = {
      dataUrl: buildUrl + '/build.data.unityweb',
      frameworkUrl: buildUrl + '/build.framework.js.unityweb',
      codeUrl: buildUrl + '/build.wasm.unityweb',
      symbolsUrl: buildUrl + '/build.symbols.json.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Ayush',
      productName: 'Holi 2025 DY Patil',
      productVersion: '0.1.0',
      showBanner: showBanner,
      devicePixelRatio: mobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.25)   // lighter on high-DPI screens
    };
    var script = document.createElement('script');
    script.src = buildUrl + '/build.loader.js';
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = (100 * p) + '%';
        pct.textContent = 'Loading ' + Math.round(100 * p) + '%';
      }).then(function (instance) {
        window.unityInstance = instance;
        loading.style.display = 'none';
        canvas.focus();
      }).catch(function (message) { showBanner(String(message), 'error'); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
